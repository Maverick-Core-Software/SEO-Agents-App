#!/usr/sbin/nft -f
# seo-prod (CT 107) host firewall: mav-bridge :8790 is reachable only from CT 103 (MCC) and loopback.
# E5 hard gate (CUTOVERPLAN §8, review F13). Installed to /etc/nftables.conf; nftables.service enabled.
flush ruleset

table inet seo {
  chain input {
    type filter hook input priority 0; policy accept;
    tcp dport 8790 ip saddr { 127.0.0.1, 192.168.1.15 } accept
    tcp dport 8790 drop
  }
}
